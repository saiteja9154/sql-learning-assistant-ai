# Render Blueprint Configuration for SQLSense AI Web Application
services:
  - type: web
    name: sqlsense-ai
    env: python
    region: oregon
    plan: free
    
    # 1. Install frontend npm dependencies & compile React production build
    # 2. Install minimal Python backend dependencies
    buildCommand: |
      npm --prefix sqlsense-ai/frontend install
      npm --prefix sqlsense-ai/frontend run build
      pip install -r sqlsense-ai/backend/requirements.txt
      
    # Starts the FastAPI application serving both the API & the React SPA
    startCommand: |
      cd sqlsense-ai/backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
