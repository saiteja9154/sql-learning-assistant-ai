# Render Blueprint Configuration for SQLSense AI Web Application
services:
  - type: web
    name: sqlsense-ai
    runtime: python
    rootDir: sqlsense-ai
    region: oregon
    plan: free
    
    # 1. Install frontend npm dependencies & compile React production build
    # 2. Install Python backend dependencies
    buildCommand: |
      npm --prefix frontend install
      npm --prefix frontend run build
      pip install -r backend/requirements.txt
      
    # Starts the FastAPI application serving both the API & the React SPA
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: HOST
        value: 0.0.0.0
