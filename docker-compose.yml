services:
  # ====================================================================
  # FastAPI Python Backend Service
  # ====================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sqlsense-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - KNOWLEDGE_DIR=/app/knowledge
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Mount knowledge directory as read-only for hot-reloading markdown documentation
      - ./knowledge:/app/knowledge:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sqlsense-network

  # ====================================================================
  # React + Vite Frontend (Nginx Production Server)
  # ====================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: sqlsense-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sqlsense-network

# ====================================================================
# Bridge Network for Inter-Container Communication
# ====================================================================
networks:
  sqlsense-network:
    driver: bridge
